name: Windows release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:release
      - run: npm run check:release -- --history HEAD
      - run: npm run build:release -- --out-dir release
      - name: Audit exact final asset before any upload
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$') { throw 'Invalid package version' }
          if ($env:IS_TAG -eq 'true' -and $env:RELEASE_TAG -ne "v$version") { throw 'Tag/package version mismatch' }
          $archive = "gpt-live-1-demo-$version-windows-x64.zip"
          node scripts/check-release.mjs --archive $archive --receipt release.audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Final archive audit failed' }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-live-1-demo-windows-x64
          path: |
            gpt-live-1-demo-${{ steps.package.outputs.version }}-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Create draft tagged release (never publish automatically)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $archive = "gpt-live-1-demo-$version-windows-x64.zip"
          node scripts/check-release.mjs --archive $archive --receipt release.audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Pre-release asset audit failed' }
          gh release create $env:RELEASE_TAG $archive SHA256SUMS.txt --draft --verify-tag --title $env:RELEASE_TAG --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
