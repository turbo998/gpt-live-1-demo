name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:release
      - name: Assemble GitHub Pages site
        env:
          AZURE_DEMO_URL: ${{ vars.AZURE_DEMO_URL }}
        run: |
          mkdir -p _site/data _site/docs
          cp -R public/* _site/
          cp -R data/* _site/data/
          cp -R docs/* _site/docs/
          touch _site/.nojekyll
          node -e 'const fs = require("fs"); const url = (process.env.AZURE_DEMO_URL || "").trim().replace(/\/+$/, ""); fs.writeFileSync("_site/demo-host.json", JSON.stringify({ demoOrigin: url }, null, 2) + "\n");'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
